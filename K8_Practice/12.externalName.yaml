---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    environment: production

---
apiVersion: v1
kind: Service
metadata:
  name: internal-db
  namespace: prod
spec:
  type: ExternalName
  externalName: mysql-prod-instance.c123456789.us-east-1.rds.amazonaws.com

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: api-container
        image: wordpress:6.4-php8.2-apache
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env:
        - name: WORDPRESS_DB_HOST
          # Binds cleanly to the local ExternalName service defined above
          value: "internal-db" 
        - name: WORDPRESS_DB_USER
          value: "admin_user"
        - name: WORDPRESS_DB_PASSWORD
          value: "SuperSecurePassword123"
        - name: WORDPRESS_DB_NAME
          value: "production_metrics"

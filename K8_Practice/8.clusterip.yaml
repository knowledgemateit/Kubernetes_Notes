apiVersion: v1
kind: Service
metadata:
  name: internal-db-svc
spec:
  type: ClusterIP      # Only accessible within the cluster
  selector:
    app: mysql-backend # Finds pods with this label
  ports:
    - protocol: TCP
      port: 3306       # The port the service listens on inside the cluster
      targetPort: 3306 # The port the actual container is running on
